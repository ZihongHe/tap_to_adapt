[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tap-to-adapt"
version = "0.1.0"
description = "Response initiation models and a pilot speech corpus"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
audio = ["torch>=2.2", "transformers==4.57.1", "soundfile>=0.12"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["tap_to_adapt*"]

[tool.pytest.ini_options]
pythonpath = ["."]

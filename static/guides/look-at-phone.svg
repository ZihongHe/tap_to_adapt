<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img" aria-labelledby="title desc"><desc>Visual cue directing attention to the mobile companion during the corresponding conversation phase.</desc>
  <title id="title">Look at the phone</title>
  <desc id="desc">A person turning toward a smartphone held in front of them</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#f3e7c4"/>
    </linearGradient>
    <linearGradient id="phoneFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f6f2"/>
      <stop offset="100%" stop-color="#cfe8e1"/>
    </linearGradient>
  </defs>
  <rect width="420" height="280" rx="28" fill="url(#bg)"/>
  <circle cx="318" cy="78" r="46" fill="#ffe8a8" opacity="0.55"/>
  <circle cx="86" cy="210" r="58" fill="#f0d89a" opacity="0.35"/>

  <!-- person torso -->
  <path d="M118 248c8-54 34-88 78-96 44 8 70 42 78 96" fill="#1f6f63"/>
  <path d="M148 248c6-38 22-62 48-68 26 6 42 30 48 68" fill="#2a8a7b"/>

  <!-- head -->
  <circle cx="196" cy="108" r="36" fill="#f2c7a5"/>
  <path d="M164 98c6-28 24-44 48-44 18 0 34 10 42 26-10 4-22 4-34 1-16-4-34-2-56 17z" fill="#2c241c"/>
  <ellipse cx="184" cy="112" rx="3.2" ry="3.8" fill="#2c241c"/>
  <path d="M208 128c6 5 14 5 20 0" fill="none" stroke="#c48a66" stroke-width="2.4" stroke-linecap="round"/>

  <!-- arm holding phone -->
  <path d="M248 168c28 8 48 22 62 42" fill="none" stroke="#f2c7a5" stroke-width="18" stroke-linecap="round"/>
  <path d="M298 198c14 10 24 24 28 40" fill="none" stroke="#f2c7a5" stroke-width="14" stroke-linecap="round"/>

  <!-- phone -->
  <g transform="translate(292 96) rotate(12)">
    <rect x="0" y="0" width="72" height="128" rx="12" fill="#24312e"/>
    <rect x="6" y="10" width="60" height="100" rx="8" fill="url(#phoneFace)"/>
    <circle cx="36" cy="118" r="4" fill="#5f746f"/>
    <rect x="24" y="5" width="24" height="3" rx="1.5" fill="#3d4d49"/>
    <!-- chat bubbles on phone -->
    <rect x="14" y="28" width="36" height="14" rx="7" fill="#1f6f63"/>
    <rect x="22" y="50" width="32" height="14" rx="7" fill="#ffffff" stroke="#9db9ad" stroke-width="1.5"/>
    <rect x="14" y="72" width="40" height="14" rx="7" fill="#1f6f63"/>
  </g>

  <!-- attention cue -->
  <g transform="translate(54 42)">
    <path d="M18 78c28-40 58-58 96-62" fill="none" stroke="#c48a1a" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10"/>
    <path d="M104 12l14 4-8 14" fill="none" stroke="#c48a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="48" y="44" fill="#7a5a14" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">看手机</text>
</svg>
